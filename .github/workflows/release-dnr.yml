name: Release Pi DNR package

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'pi-dnr-v[0-9]+.[0-9]+.[0-9]+-[0-9]+'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-dnr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test pi-dnr
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/pi-dnr-cache/npm
          key: pi-dnr-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: pi-dnr-npm-
      - name: Build in the official Arch image using standalone dnc
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          DNC_VERSION: '0.4.0'
        run: |
          mkdir -p "$RUNNER_TEMP/pi-dnr-cache" .artifacts/dnr-release
          docker pull ghcr.io/archlinux/archlinux:base-devel
          docker image inspect ghcr.io/archlinux/archlinux:base-devel \
            --format '{{json .RepoDigests}}' > .artifacts/dnr-release/container-image.txt
          docker run --rm \
            --volume "$PWD:/work" \
            --volume "$RUNNER_TEMP/pi-dnr-cache:/cache" \
            --env "PI_BUILD_UID=$(id -u)" \
            --workdir /work \
            ghcr.io/archlinux/archlinux:base-devel \
            bash scripts/ci/build-dnr-arch.sh "$RELEASE_TAG" "$RELEASE_COMMIT" "$DNC_VERSION" \
            2>&1 | tee .artifacts/pi-dnr-build.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pi-dnr-package
          path: .artifacts/dnr-release/*
          if-no-files-found: error
          compression-level: 0
      - name: Preserve build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pi-dnr-build-log
          path: .artifacts/pi-dnr-build.log
          if-no-files-found: ignore

  release:
    concurrency:
      group: publish-dnr-${{ github.ref_name }}
      cancel-in-progress: false
    name: Publish Pi DNR release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pi-dnr-package
          path: release-assets
      - name: Check out reviewed distribution helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fansion314/packages
          ref: 2541818619fec1816c135b7579d908b1a409e0b6
          path: .distribution
          persist-credentials: false
      - name: Sign the verified pacman archives
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH_SIGNING_PRIVATE_KEY: ${{ secrets.ARCH_SIGNING_PRIVATE_KEY }}
          ARCH_SIGNING_PASSPHRASE: ${{ secrets.ARCH_SIGNING_PASSPHRASE }}
          ARCH_SIGNING_KEY_ID: ${{ secrets.ARCH_SIGNING_KEY_ID }}
        run: python3 .distribution/arch/sign.py directory release-assets --tag "$GITHUB_REF_NAME"
      - name: Publish package and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/publish-dnr-arch.sh

  notify-distribution:
    name: Notify unified package distribution
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.DISTRIBUTION_APP_ID }}
          private-key: ${{ secrets.DISTRIBUTION_APP_PRIVATE_KEY }}
          owner: fansion314
          repositories: packages
          permission-actions: write
      - name: Dispatch the applicable downstream checks
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh workflow run downstream.yml -R fansion314/packages --ref main -f project=pi -f platform=arch
